[project]
name = "neuralake"
version = "0.1.0"
description = "Production-grade AI Knowledge Base with Memory Layer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Subhadeep Ganguly", email = "subhadeepganguly08@gmail.com"},
]
keywords = ["ai", "knowledge-base", "memory", "rag", "vector-search", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "tiktoken>=0.8.0",
    "sentence-transformers>=3.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=5.0.0",
    "apscheduler>=3.10.0",
    "structlog>=24.0.0",
    "pymupdf4llm>=0.0.10",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.1.0",
    "markdown>=3.7",
    "mcp>=1.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]
neo4j = ["neo4j>=5.25.0"]
local = ["sentence-transformers>=3.0.0"]

[project.scripts]
neuralake = "neuralake.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuralake"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
