services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: neuralake
      POSTGRES_PASSWORD: neuralake
      POSTGRES_DB: neuralake
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuralake"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      NEURALAKE_DATABASE__URL: postgresql+asyncpg://neuralake:neuralake@db:5432/neuralake
      NEURALAKE_REDIS__URL: redis://redis:6379/0
      NEURALAKE_LLM__ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEURALAKE_EMBEDDING__OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  pgdata:
